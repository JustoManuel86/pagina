<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body class="d-flex flex-column" style="height: 100vh; margin: 0;">


    <div id="header-container"></div>

    <div class="login-container-wrapper">
        <div class="login-container">
            <h3>Iniciar Sesión</h3>
            <form>
                
                <div class="form-group mb-3">
                    <input type="email" class="form-control" id="email" placeholder="Correo electrónico" required>
                </div>
                
                <div class="form-group mb-3">
                    <input type="password" class="form-control" id="password" placeholder="Contraseña" required>
                </div>
                
                <div class="form-check mb-3">
                    <input type="checkbox" class="form-check-input" id="remember">
                    <label class="form-check-label" for="remember">Recordarme</label>
                </div>
                <a href="#" class="forgot-password d-block text-end">¿Olvidaste tu contraseña?</a><br>
                
                
                <a href="./private_landing.html" class="boton-login">Iniciar Sesión</a>
                
            </form>
        </div>
    </div>

    <div id="footer-container" class="mt-auto"></div>

    <script src="../js/cabecera_footer.js"></script>
   
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
