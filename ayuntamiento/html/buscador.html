<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscador</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
    
</head>
<body class="d-flex flex-column" style="height: 100vh; margin: 0;">

    <div id="header-container"></div>

    <div class="search-container">
      
        <div class="search-bar-wrapper">
            <div class="input-group">
                <input type="text" class="form-control" placeholder="Busca aquí..." aria-label="Barra de búsqueda">
                <a href="./comercio_list.html">
                    <button class="boton-lupa" type="button">
                        <i class="bi bi-search"></i>
                    </button> 
                </a>
                
            </div>
        </div>
        
        <div class="filter-buttons">
            <button type="button" class="boton-search">Provincia</button>
            <button type="button" class="boton-search">Ciudad</button>
            <button type="button" class="boton-search">Distrito</button>
            <button type="button" class="boton-search">Asociación</button>
            <button type="button" class="boton-search">Categoría</button>
            <button type="button" class="boton-search">Subcategoría</button>
            <button type="button" class="boton-search">Nombre</button>
        </div>
    </div>

    <div id="footer-container" class="mt-auto"></div>

    <script src="../js/cabecera_footer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
