<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comercio_detail</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body class="d-flex flex-column" style="height: 100vh; margin: 0;">

    <div id="header-container"></div>

    <label class="text-center mt-3">Administración</label>
    <input class="text-center mt-3" type="checkbox" id="toggle">
    
    <div class="content container mt-4 publico">
        <div class="row ">
            <div class="col-md-6">
                <div class="p-3 border bg-light">
                    <h3>Información</h3>
                    <p><b>Nombre:</b>Comestibles Kiko</p>
                    <p><b>Localidad:</b>Elche</p>
                    <p><b>Dirección:</b> C/ Avda. España</p>
                    <p><b>Provincia:</b> Alicante</p>
                    <p><b>Código Postal:</b> 03021</p>
                </div>
            </div>
            <div class="col-md-6 publico">
                <div class="p-3 border bg-light">
                    <h3>Imagen</h3>
                    <img src="../images/comestibleskiko.jpg" alt="Imagen" class="img-fluid">
                </div>
            </div>
        </div>

        <div class="row mt-4 publico">
            <div class="col-md-6">
                <div class="p-3 border bg-light">
                    <h3>Contacto</h3>
                    <a href="mailto:correo@gmail.com" class="detail_a"><b>Email: </b>comestibleskiko@gmail.com</a>
                    <p><b>Teléfono:</b> 654654654</p>
                </div>
            </div>
            <div class="col-md-6 publico">
                <div class="p-3 border bg-light">
                    <h3>Dónde Está</h3>
                    <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d1148.9059065733911!2d-2.0499440380101115!3d38.45143425375607!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0xd65c4bbfbf2d6ef%3A0xfdad3f63fe19e6ae!2sAv.%20Espa%C3%B1a%2C%2002430%2C%20Albacete!5e0!3m2!1ses!2ses!4v1734017461882!5m2!1ses!2ses" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
                </div>
            </div>
        </div>
    </div>

        <div class="formulario container mt-5">
            <h3 class="mb-4">Editar Información</h3>
            <form>
                <div class="mb-3">
                    <label for="nombre" class="form-label">Nombre</label>
                    <input type="text" class="form-control" id="nombre" value="Comestibles Kiko">
                </div>
                <div class="mb-3">
                    <label for="localidad" class="form-label">Localidad</label>
                    <input type="text" class="form-control" id="localidad" value="Elche">
                </div>
                <div class="mb-3">
                    <label for="direccion" class="form-label">Dirección</label>
                    <input type="text" class="form-control" id="direccion" value="C/ Avda. España">
                </div>
                <div class="mb-3">
                    <label for="provincia" class="form-label">Provincia</label>
                    <input type="text" class="form-control" id="provincia" value="Alicante">
                </div>
                <div class="mb-3">
                    <label for="codigoPostal" class="form-label">Código Postal</label>
                    <input type="text" class="form-control" id="codigoPostal" value="03021">
                </div>
        
                <div class="mb-3">
                    <label for="imagen" class="form-label">Imagen</label>
                    <input type="file" class="form-control" id="imagen">
                </div>
        
                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" class="form-control" id="email" value="comestibleskiko@gmail.com">
                </div>
                <div class="mb-3">
                    <label for="telefono" class="form-label">Teléfono</label>
                    <input type="tel" class="form-control" id="telefono" value="654654654">
                </div>
        
                <div class="mb-3">
                    <label for="mapa" class="form-label">URL del Mapa</label>
                    <input type="url" class="form-control" id="mapa" value="https://www.google.com/maps/embed?...">
                </div>
        
                <div class="d-flex justify-content-between">
                    <button type="submit" class="boton-naranja mb-4">Guardar Cambios</button>
                    <button type="reset" class="boton-azul mb-4">Restablecer</button>
                </div>
            </form>
        </div>

    <div id="footer-container" class="mt-auto"></div>

    <script src="../js/cabecera_footer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
