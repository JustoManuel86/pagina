<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body class="d-flex flex-column" style="height: 100vh; margin: 0;">


    <div id="header-container"></div>

    <div class="container mt-5">
        <h3 class="mb-4">Editar Información</h3>
        <form>
            
            <div class="mb-3">
                <label for="nombre" class="form-label">Nombre</label>
                <input type="text" class="form-control" id="nombre" value="Comestibles Kiko">
            </div>
            <div class="mb-3">
                <label for="localidad" class="form-label">Localidad</label>
                <input type="text" class="form-control" id="localidad" value="Elche">
            </div>
            <div class="mb-3">
                <label for="direccion" class="form-label">Dirección</label>
                <input type="text" class="form-control" id="direccion" value="C/ Avda. España">
            </div>
            <div class="mb-3">
                <label for="provincia" class="form-label">Provincia</label>
                <input type="text" class="form-control" id="provincia" value="Alicante">
            </div>
            <div class="mb-3">
                <label for="codigoPostal" class="form-label">Código Postal</label>
                <input type="text" class="form-control" id="codigoPostal" value="03021">
            </div>
    
            
            <div class="mb-3">
                <label for="imagen" class="form-label">Imagen</label>
                <input type="file" class="form-control" id="imagen">
            </div>
    
            
            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" value="comestibleskiko@gmail.com">
            </div>
            <div class="mb-3">
                <label for="telefono" class="form-label">Teléfono</label>
                <input type="tel" class="form-control" id="telefono" value="654654654">
            </div>
    
            
            <div class="mb-3">
                <label for="mapa" class="form-label">URL del Mapa</label>
                <input type="url" class="form-control" id="mapa" value="https://www.google.com/maps/embed?...">
            </div>
    
            
            <div class="d-flex justify-content-between">
                <button type="submit" class="boton-naranja mb-2">Guardar Cambios</button>
                <button type="reset" class="boton-azul mb-2">Restablecer</button>
            </div>
        </form>
    </div>


    <div id="footer-container" class="mt-auto"></div>

    <script src="../js/cabecera_footer.js"></script>
   
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
