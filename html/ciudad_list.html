<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ciudad List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body class="d-flex flex-column" style="height: 100vh; margin: 0;">


    <div id="header-container"></div>

    <label class="text-center mt-3">Administración</label>
    <input class="text-center mt-3" type="checkbox" id="toggle">

    <div class="publico container my-5">
      <div class="card">
          <div class="card-header titulo text-white text-center fs-4">
              Lista de Ciudades
          </div>
          <ul class="list-group list-group-flush">
              <li class="list-group-item d-flex justify-content-between align-items-center">
                  <span><strong>C01</strong> - Madrid</span>
              </li>
              <li class="list-group-item d-flex justify-content-between align-items-center">
                  <span><strong>C02</strong> - Barcelona</span>
              </li>
              <li class="list-group-item d-flex justify-content-between align-items-center">
                  <span><strong>C03</strong> - Sevilla</span>
              </li>
              <li class="list-group-item d-flex justify-content-between align-items-center">
                  <span><strong>C04</strong> - Valencia</span>
              </li>
          </ul>
      </div>
    </div>
  


    <div class="oculto container my-5">
    <div class="d-flex justify-content-center mb-3">
        <button class="boton-azul">Añadir ciudad</button>
    </div>

    <div class="container my-5">
        <h3 class="text-center mb-4">Administrar Ciudades</h3>
        <div class="list-group">
            <div class="list-group-item border-0 d-flex justify-content-between align-items-center">
                <div class="d-flex flex-grow-1 align-items-center">
                    <label for="codigo1" class="me-2">Código:</label>
                    <input id="codigo1" type="text" class="form-control me-3" value="C01" placeholder="Código">
                    <label for="ciudad1" class="me-2">Ciudad:</label>
                    <input id="ciudad1" type="text" class="form-control me-2" value="Madrid" placeholder="Nombre de la ciudad">
                </div>
                <button class="editar-amarillo me-3">Actualizar</button>
                <button class="editar-rojo btn-sm">Eliminar</button>
            </div>
            <div class="list-group-item border-0 d-flex justify-content-between align-items-center">
                <div class="d-flex flex-grow-1 align-items-center">
                    <label for="codigo2" class="me-2">Código:</label>
                    <input id="codigo2" type="text" class="form-control me-3" value="C02" placeholder="Código">
                    <label for="ciudad2" class="me-2">Ciudad:</label>
                    <input id="ciudad2" type="text" class="form-control me-2" value="Barcelona" placeholder="Nombre de la ciudad">
                </div>
                <button class="editar-amarillo me-3">Actualizar</button>
                <button class="editar-rojo btn-sm">Eliminar</button>
            </div>
            <div class="list-group-item border-0 d-flex justify-content-between align-items-center">
                <div class="d-flex flex-grow-1 align-items-center">
                    <label for="codigo3" class="me-2">Código:</label>
                    <input id="codigo3" type="text" class="form-control me-3" value="C03" placeholder="Código">
                    <label for="ciudad3" class="me-2">Ciudad:</label>
                    <input id="ciudad3" type="text" class="form-control me-2" value="Sevilla" placeholder="Nombre de la ciudad">
                </div>
                <button class="editar-amarillo me-3">Actualizar</button>
                <button class="editar-rojo btn-sm">Eliminar</button>
            </div>
            <div class="list-group-item border-0 d-flex justify-content-between align-items-center">
                <div class="d-flex flex-grow-1 align-items-center">
                    <label for="codigo4" class="me-2">Código:</label>
                    <input id="codigo4" type="text" class="form-control me-3" value="C04" placeholder="Código">
                    <label for="ciudad4" class="me-2">Ciudad:</label>
                    <input id="ciudad4" type="text" class="form-control me-2" value="Valencia" placeholder="Nombre de la ciudad">
                </div>
                <button class="editar-amarillo me-3">Actualizar</button>
                <button class="editar-rojo btn-sm">Eliminar</button>
               </div>
            </div>
        </div>
    </div>

      
      
        
       
        <nav aria-label="Paginación" class="mt-3">
          <ul class="pagination justify-content-center">
            <li class="page-item disabled">
              <span class="page-link">Anterior</span>
            </li>
            <li class="page-item active">
              <span class="page-link">1</span>
            </li>
            <li class="page-item">
              <a class="page-link" href="#">2</a>
            </li>
            <li class="page-item">
              <a class="page-link" href="#">3</a>
            </li>
            <li class="page-item">
              <a class="page-link" href="#">Siguiente</a>
            </li>
          </ul>
        </nav>
      

    <div id="footer-container" class="mt-auto"></div>

    <script src="../js/cabecera_footer.js"></script>
   
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
