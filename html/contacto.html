<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    
    <div id="header-container"></div>

    <div id="contacto"></div>

    <div class="contenedor-principal d-flex align-items-center justify-content-center">
        <div class="container contact-form">
            <div class="contact-image">
                <img src="../images/ESCUDO-NEGRO.png" alt="logo_elche"/>
            </div>
            <form method="post">
                <h3>Envíanos un mensaje</h3>
               <div class="row">
                    <div class="col-md-6">
                        <div class="form-group">
                            <input type="text" name="txtName" class="form-control" placeholder="Nombre" value="" />
                        </div> <br>
                        <div class="form-group">
                            <input type="text" name="txtEmail" class="form-control" placeholder="Email" value="" />
                        </div> <br>
                        <div class="form-group">
                            <input type="text" name="txtPhone" class="form-control" placeholder="Telefono" value="" />
                        </div><br>
                        <div class="form-group">
                            <input type="submit" name="btnSubmit" class="btnContact" value="Enviar" />
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-group">
                            <textarea name="txtMsg" class="form-control" placeholder="Su Mensaje" rows="6"></textarea>
                        </div>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <div id="footer-container" class="mt-auto"></div>
    
    <script src="../js/cabecera_footer.js"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
